name: Bug 报告
description: 工具链行为与文档不符（scirearch CLI、合同校验、omp 设施）
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: 现象
      description: 期望发生什么，实际发生了什么
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 最小复现
      description: 可直接粘贴的命令序列与输出（避免"我这边跑不通"这类描述）
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      description: 输出 `scirearch --version`、`python -V`，omp 相关请附 omp 版本
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: 环境
      description: 操作系统、Python、是否有 omp 参与（子agent / advisor / hook）
    validations:
      required: false
